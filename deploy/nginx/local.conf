# Local load balancer: three API instances behind one Nginx (scripts/cluster.sh).
# Paths are relative to the prefix the script passes with -p (.dev/nginx/).
worker_processes auto;
error_log logs/error.log warn;
pid nginx.pid;

events {
  worker_connections 8192;
}

http {
  access_log off;

  upstream api {
    # Each request goes to the instance with the fewest in-flight requests. This beats
    # round-robin when some requests (a seat hold) take much longer than others (a cached read).
    least_conn;
    server 127.0.0.1:3001 max_fails=3 fail_timeout=5s;
    server 127.0.0.1:3002 max_fails=3 fail_timeout=5s;
    server 127.0.0.1:3003 max_fails=3 fail_timeout=5s;
    # Reuse connections to the instances instead of opening one per request.
    keepalive 64;
  }

  # WebSocket upgrades need "Connection: upgrade"; everything else gets an empty Connection
  # header, which keeps the upstream keepalive connections alive.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  server {
    listen 8080;
    client_max_body_size 1m;

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      # Append the client's address. The API trusts only this (loopback) hop, so a client
      # can't forge its IP by sending its own X-Forwarded-For.
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      # WebSocket connections are long-lived.
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      # Retry on another instance only if this one couldn't be reached (connection refused
      # or timed out). Deliberately NOT on http_503: the API answers 503 + Retry-After when
      # it sheds load, and counting those as failures (max_fails) makes Nginx mark every busy
      # instance dead, turning graceful overload into a total outage ("no live upstreams").
      # Load tests showed exactly that. Nginx also never retries a POST that may have
      # reached an instance, so a hold can't be sent twice.
      proxy_next_upstream error timeout;
    }
  }
}
