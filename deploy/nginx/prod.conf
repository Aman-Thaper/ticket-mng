# Main Nginx config for production (deploy/docker-compose.prod.yml mounts it over the image's
# default). The site itself, with TLS, is templates/ticket-mng.conf.template, which the image
# renders into conf.d/.
worker_processes auto;
# Every proxied request or WebSocket holds two file descriptors (client + upstream). Raise the
# per-worker limit (containers default to 1024) so worker_connections is actually reachable:
# during an on-sale, every open seat map is a WebSocket.
worker_rlimit_nofile 65536;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
  worker_connections 8192;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off; # don't advertise the Nginx version

  include /etc/nginx/conf.d/*.conf;
}
