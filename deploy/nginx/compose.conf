# Load balancer for docker-compose.yml: Nginx in front of the API replicas.
worker_processes auto;
# Every proxied request or WebSocket holds two file descriptors (client + upstream). Raise the
# per-worker limit (containers default to 1024) so worker_connections is actually reachable.
worker_rlimit_nofile 65536;
error_log /dev/stderr warn;

events {
  worker_connections 8192;
}

http {
  # One JSON line per request, sharing its request id with the API's logs.
  log_format json escape=json
    '{"time":"$time_iso8601","request_id":"$request_id","client":"$remote_addr",'
    '"method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
    '"duration_s":$request_time,"upstream":"$upstream_addr","upstream_s":"$upstream_response_time"}';
  access_log /dev/stdout json;

  # Docker's internal DNS. With "resolve" below, Nginx re-resolves "api" as replicas are
  # added, removed or restarted (new container IPs), with no reload needed.
  resolver 127.0.0.11 valid=2s ipv6=off;

  upstream api {
    zone api 64k;
    least_conn;
    # The servers: normally "api", which Docker's DNS resolves to every replica. Written at
    # startup by deploy/nginx/api-upstream.sh, and swapped by deploy/rollout.sh during deploys.
    include /etc/nginx/upstream-api.conf;
    keepalive 64;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  server {
    listen 80;
    client_max_body_size 1m;

    # Prometheus scrapes the instances directly inside the network; never expose metrics.
    location = /metrics {
      return 404;
    }

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      # A replica that was just removed leaves an IP that nothing answers, so a connection
      # attempt would hang for the default 60 s. Connecting inside one host takes microseconds:
      # give up after 2 s and retry on another replica (the request was never sent, so this is
      # safe even for POST).
      proxy_connect_timeout 2s;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      # Only retry when an instance can't be reached. A 503 from the API is deliberate load
      # shedding; see deploy/nginx/local.conf for why retrying it causes an outage.
      proxy_next_upstream error timeout;
    }
  }
}
