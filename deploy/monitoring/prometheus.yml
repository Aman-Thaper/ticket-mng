# Scrapes every API replica (found through Docker DNS) and the worker.
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: api
    dns_sd_configs:
      - names: ['api']
        type: A
        port: 3000
        refresh_interval: 15s

  - job_name: worker
    static_configs:
      - targets: ['worker:3100']
