<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Your events · Ticket MNG</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/site.css" />
    <link rel="stylesheet" href="/organizer.css" />
    <script type="module" src="/organizer.js"></script>
  </head>
  <body>
    <header id="site-header"></header>

    <main class="page organizer-page">
      <div class="page-head">
        <div>
          <h1>Your events</h1>
          <p class="muted">Sales, money and the door, for every event you run.</p>
        </div>
        <a id="create" class="button" href="/organizer/events/new">Create an event</a>
      </div>
      <div id="totals" class="stat-cards" hidden></div>
      <div id="events" aria-live="polite"><p class="muted">Loading your events…</p></div>
    </main>

    <footer class="site-footer">
      <span>© Ticket MNG</span>
      <a href="/">Events</a>
      <a href="/docs">API</a>
    </footer>
  </body>
</html>
