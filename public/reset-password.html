<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ticket MNG · Choose a new password</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/reset-password.js"></script>
  </head>
  <body>
    <main class="panel center">
      <h1>Choose a new password</h1>
      <form id="reset-form">
        <p>
          <label for="password">New password (at least 8 characters)</label><br />
          <input
            id="password"
            type="password"
            minlength="8"
            maxlength="128"
            autocomplete="new-password"
            required
          />
        </p>
        <p>
          <label for="confirm">Repeat it</label><br />
          <input
            id="confirm"
            type="password"
            minlength="8"
            maxlength="128"
            autocomplete="new-password"
            required
          />
        </p>
        <button type="submit">Save password</button>
      </form>
      <p id="message" class="message" role="alert"></p>
      <p><a href="/">Back to the seat map</a></p>
    </main>
  </body>
</html>
