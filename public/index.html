<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Ticket MNG · Live events and tickets</title>
    <meta
      name="description"
      content="Concerts, theatre, comedy, sports and festivals. Pick your seats on a live map and get your tickets by email."
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/site.css" />
    <script type="module" src="/catalog.js"></script>
  </head>
  <body>
    <header id="site-header"></header>

    <main>
      <section class="hero">
        <div class="hero-inner">
          <h1>Find your next night out</h1>
          <p>Concerts, theatre, comedy, sports and festivals. Pick your exact seats on a live map.</p>
          <form id="search-form" class="search" role="search">
            <svg
              class="search-icon"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" />
            </svg>
            <input
              id="q"
              name="q"
              type="search"
              placeholder="Search events, artists, teams…"
              aria-label="Search events"
              maxlength="100"
              autocomplete="off"
            />
            <button type="submit">Search</button>
          </form>
        </div>
      </section>

      <nav class="categories" aria-label="Categories">
        <div class="chips" id="chips">
          <button type="button" class="chip" data-category="">All events</button>
          <button type="button" class="chip" data-category="concert">
            <span aria-hidden="true">🎤</span> Concerts
          </button>
          <button type="button" class="chip" data-category="theatre">
            <span aria-hidden="true">🎭</span> Theatre
          </button>
          <button type="button" class="chip" data-category="comedy">
            <span aria-hidden="true">🎙️</span> Comedy
          </button>
          <button type="button" class="chip" data-category="sports">
            <span aria-hidden="true">🏟️</span> Sports
          </button>
          <button type="button" class="chip" data-category="festival">
            <span aria-hidden="true">🎪</span> Festivals
          </button>
          <button type="button" class="chip" data-category="other">
            <span aria-hidden="true">✨</span> More
          </button>
        </div>
      </nav>

      <div id="results" class="results" aria-live="polite"></div>
    </main>

    <footer class="site-footer">
      <span>© Ticket MNG</span>
      <a href="/my-tickets">My tickets</a>
      <a href="/docs">API</a>
    </footer>
  </body>
</html>
