<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ticket MNG · Pick your seats</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/"
        ><span class="logo"
          ><svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M3 9a3 3 0 0 0 0 6v3a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-3a3 3 0 0 0 0-6V6a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1z"
            />
            <path d="M13 5v2M13 11v2M13 17v2" /></svg></span
        ><span>Ticket MNG</span></a
      >
      <nav class="account" aria-label="Account">
        <div id="guest" class="guest">
          <a id="login-link" class="nav-link" href="/login">Log in</a>
          <a id="signup-link" class="nav-button" href="/signup">Sign up</a>
        </div>
        <div id="user-menu" class="user-menu" hidden>
          <button
            id="menu-button"
            class="menu-button"
            type="button"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="menu"
          >
            <span id="avatar" class="avatar" aria-hidden="true"></span>
            <span id="menu-name" class="menu-name"></span>
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m6 9 6 6 6-6" />
            </svg>
          </button>
          <div id="menu" class="menu" role="menu" hidden>
            <div class="menu-head">
              <strong id="menu-full-name"></strong>
              <span id="menu-email"></span>
              <span id="menu-verified" class="verified-badge"></span>
            </div>
            <button id="logout" type="button" role="menuitem">Log out</button>
          </div>
        </div>
      </nav>
    </header>

    <div id="verify-banner" class="banner" hidden>
      <span
        >Confirm your email address to book tickets. We sent a link to
        <strong id="banner-email"></strong>.</span
      >
      <button id="resend" type="button" class="banner-action">Resend email</button>
      <span id="banner-note" class="banner-note" role="status" aria-live="polite"></span>
    </div>

    <main class="layout">
      <section class="panel map-panel" aria-labelledby="event-title">
        <div class="panel-head">
          <label class="event-picker">
            <span class="muted">Event</span>
            <select id="event-select" aria-label="Choose an event"></select>
          </label>
          <span id="live-status" class="pill" role="status" aria-live="polite">connecting…</span>
        </div>
        <h1 id="event-title">Loading events…</h1>
        <p id="event-meta" class="muted"></p>
        <div class="legend" aria-hidden="true">
          <span><i class="dot available"></i>available</span>
          <span><i class="dot held"></i>held</span>
          <span><i class="dot booked"></i>sold</span>
          <span><i class="dot selected"></i>your selection</span>
          <span id="counts" class="muted"></span>
        </div>
        <div id="map-scroll" class="map-scroll">
          <svg id="seat-map" role="group" aria-label="Seat map"></svg>
        </div>
        <p id="map-tooltip" class="muted tooltip" aria-live="polite">&nbsp;</p>
      </section>

      <aside class="panel checkout" aria-labelledby="checkout-title">
        <h2 id="checkout-title">Your seats</h2>
        <ul id="selection" class="selection"></ul>
        <p id="selection-total" class="total"></p>
        <button id="hold-button" type="button" disabled>Hold seats</button>

        <div id="booking" hidden>
          <h3>Booking <span id="booking-status" class="pill"></span></h3>
          <p id="countdown" class="countdown" aria-live="polite"></p>
          <label>
            <span class="muted">Test card</span>
            <select id="card">
              <option value="4242424242424242">4242… succeeds</option>
              <option value="4000000000000077">…0077 processing, then succeeds</option>
              <option value="4000000000000002">…0002 declined</option>
              <option value="4000000000009995">…9995 insufficient funds</option>
            </select>
          </label>
          <div class="row">
            <button id="pay-button" type="button">Pay</button>
            <button id="cancel-button" type="button" class="secondary">Cancel hold</button>
          </div>
          <div id="tickets" class="tickets"></div>
        </div>

        <p id="message" class="message" role="alert"></p>

        <details class="log">
          <summary>Activity</summary>
          <ol id="log"></ol>
        </details>
      </aside>
    </main>
  </body>
</html>
