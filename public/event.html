<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Event · Ticket MNG</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/site.css" />
    <script type="module" src="/event.js"></script>
  </head>
  <body>
    <header id="site-header"></header>

    <section id="event-hero" class="event-hero">
      <div class="event-hero-inner">
        <div id="event-art" class="card-art" aria-hidden="true"></div>
        <div>
          <a class="back-link" href="/">← All events</a>
          <div>
            <span id="event-category" class="hero-pill"></span>
            <span id="event-availability" class="hero-pill" hidden></span>
            <span id="event-live" class="hero-pill live-pill" hidden>
              <i class="pulse" aria-hidden="true"></i><span id="event-live-text"></span>
            </span>
          </div>
          <h1 id="event-title">Loading…</h1>
          <ul class="event-facts">
            <li>
              <span aria-hidden="true">📅</span> <strong id="event-date"></strong>
              <span id="event-time"></span>
            </li>
            <li><span aria-hidden="true">📍</span> <strong id="event-venue"></strong></li>
            <li><span aria-hidden="true">🎟️</span> <strong id="event-price"></strong></li>
          </ul>
          <p id="event-description" class="event-description"></p>
        </div>
      </div>
    </section>

    <main class="layout">
      <section class="panel map-panel" aria-labelledby="map-title">
        <div class="panel-head">
          <h2 id="map-title">Pick your seats</h2>
          <span id="live-status" class="pill" role="status" aria-live="polite">connecting…</span>
        </div>
        <div class="legend" aria-hidden="true">
          <span><i class="dot available"></i>available</span>
          <span><i class="dot held"></i>held</span>
          <span><i class="dot booked"></i>sold</span>
          <span><i class="dot selected"></i>your selection</span>
          <span id="counts" class="muted"></span>
        </div>
        <div id="map-scroll" class="map-scroll">
          <svg id="seat-map" role="group" aria-label="Seat map"></svg>
        </div>
        <p id="map-tooltip" class="muted tooltip" aria-live="polite">&nbsp;</p>
      </section>

      <aside class="panel checkout" aria-labelledby="checkout-title">
        <section class="best" aria-labelledby="best-title">
          <h2 id="best-title">Best available</h2>
          <div class="best-options">
            <label>
              <span class="muted">Seats</span>
              <select id="best-quantity" aria-label="Number of seats"></select>
            </label>
            <label>
              <span class="muted">Price</span>
              <select id="best-price" aria-label="Highest price per seat">
                <option value="">Any price</option>
              </select>
            </label>
          </div>
          <button id="best-button" type="button">Find the best seats</button>
          <p class="or muted">or pick your own seats on the map</p>
        </section>

        <h2 id="checkout-title">Your seats</h2>
        <ul id="selection" class="selection"></ul>
        <p id="selection-total" class="total"></p>
        <button id="hold-button" type="button" disabled>Hold seats</button>

        <div id="booking" hidden>
          <h3>Booking <span id="booking-status" class="pill"></span></h3>
          <p id="countdown" class="countdown" aria-live="polite"></p>
          <label>
            <span class="muted">Test card</span>
            <select id="card">
              <option value="4242424242424242">4242… succeeds</option>
              <option value="4000000000000077">…0077 processing, then succeeds</option>
              <option value="4000000000000002">…0002 declined</option>
              <option value="4000000000009995">…9995 insufficient funds</option>
            </select>
          </label>
          <div class="row">
            <button id="pay-button" type="button">Pay</button>
            <button id="cancel-button" type="button" class="secondary">Cancel hold</button>
          </div>
          <div id="tickets" class="tickets"></div>
          <p id="tickets-link" class="muted" hidden>
            Your tickets are also under <a href="/my-tickets">My tickets</a>.
          </p>
        </div>

        <p id="message" class="message" role="alert"></p>

        <details class="log">
          <summary>Activity</summary>
          <ol id="log"></ol>
        </details>
      </aside>
    </main>
  </body>
</html>
